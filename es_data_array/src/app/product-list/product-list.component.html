<div class="card">
    <div class="card-header bg-primary text-white">
      <h3>Lista Prodotti</h3>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li *ngFor="let product of products" class="list-group-item">
          <div (click)="onSelect(product)" style="cursor: pointer;">
            <div class="d-flex justify-content-between align-items-center">
              <span>
                {{product.name}} - {{product.price | currency:'EUR'}}
              </span>
              <button class="btn btn-danger btn-sm" (click)="onDelete(product.id); $event.stopPropagation()">
                Elimina
              </button>
            </div>
  
            <div *ngIf="selectedProduct?.id === product.id" class="mt-2 p-2 bg-light rounded">
              <strong>Descrizione:</strong> {{product.description}}
            </div>
          </div>
        </li>
      </ul>
    </div>
    <div class="card-footer">
      <h4>Aggiungi nuovo prodotto</h4>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Nome:</label>
          <input type="text" class="form-control" [(ngModel)]="newProduct.name" name="name" required>
        </div>
        <div class="form-group">
          <label>Prezzo:</label>
          <input type="number" class="form-control" [(ngModel)]="newProduct.price" name="price" required>
        </div>
        <div class="form-group">
          <label>Descrizione:</label>
          <textarea class="form-control" [(ngModel)]="newProduct.description" name="description" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Aggiungi</button>
      </form>
    </div>
  </div>
